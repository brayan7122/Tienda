<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | El Enemigos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="barra-navegacion">
        <div class="logotipo">
            <img src="img/logo.png" alt="Logo El Enemigos">
            <span>EL ENEMIGOS</span>
        </div>
        <nav class="enlaces-navegacion">
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>
    <main class="login-main">
        <section class="login-section">
            <h1>Iniciar Sesión</h1>
            <form id="login-form" class="login-form">
                <div class="campo-form">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required autocomplete="username">
                </div>
                <div class="campo-form">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="boton boton-gradiente">Entrar</button>
                <div id="login-error" class="login-error" style="display:none;color:red;margin-top:10px;"></div>
            </form>
        </section>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
